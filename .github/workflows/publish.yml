name: Publish release

on:
  push:
    tags:
      - "v*"

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 24.x
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  build:
    name: Build and test release artifacts
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Determine release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Could not determine release version.'
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Building release version $version"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack NuGet packages
        shell: pwsh
        run: |
          $projects = @(
            "src/HelpService.Core/PeterSpoenemann.HelpService.Core.csproj",
            "src/HelpService/PeterSpoenemann.HelpService.csproj"
          )
          foreach ($project in $projects) {
            dotnet pack $project `
              --configuration Release `
              --no-build `
              --output ./artifacts `
              -p:PackageVersion="$env:PACKAGE_VERSION"
          }

      - name: Set VS Code extension version
        shell: pwsh
        run: |
          npm --prefix vscode-extension version `
            "$env:PACKAGE_VERSION" `
            --no-git-tag-version `
            --allow-same-version

      - name: Install VS Code extension dependencies
        run: npm --prefix vscode-extension ci

      - name: Build VS Code extension
        shell: pwsh
        run: |
          npm --prefix vscode-extension run package -- `
            --out "../artifacts/PeterSpoenemann.HelpService.Preview.vsix"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/*.vsix
          if-no-files-found: error

  publish-nuget:
    name: Publish NuGet packages
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: artifacts

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem ./artifacts -Filter *.nupkg)
          if ($packages.Count -eq 0) {
            throw 'No .nupkg file found.'
          }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key $env:NUGET_API_KEY `
              --source $env:NUGET_SOURCE `
              --skip-duplicate
          }

  github-release:
    name: Create GitHub release
    needs: [build, publish-nuget]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: artifacts

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $releaseOptions = @()
          if ($version.Contains('-')) {
            $releaseOptions += '--prerelease'
          }

          gh release create "$env:GITHUB_REF_NAME" `
            "./artifacts/PeterSpoenemann.HelpService.Preview.vsix#VS Code Extension" `
            --repo "$env:GITHUB_REPOSITORY" `
            --verify-tag `
            --generate-notes `
            --title "PeterSpoenemann.HelpService $version" `
            @releaseOptions
